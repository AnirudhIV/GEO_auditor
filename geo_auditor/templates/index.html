<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO Auditor - AI Search Visibility Check</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f7f8fa; color: #1a1d23;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 14px; padding: 36px; width: 100%; max-width: 480px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: #565d6b; font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d5d9df; border-radius: 8px; font-size: 14px; }
  input:focus { outline: 2px solid #4338ca; outline-offset: 1px; }
  button {
    margin-top: 22px; width: 100%; padding: 12px; background: #4338ca; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #372eb0; }
  .error { background: #fdecea; color: #c0362c; border: 1px solid #f3c6c1; border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 16px; }
  .hint { color: #565d6b; font-size: 12px; margin-top: 4px; }
  .loading { display: none; text-align: center; color: #565d6b; font-size: 13.5px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>GEO Auditor</h1>
    <p class="sub">Check how visible a business is to ChatGPT, Perplexity, Claude, and Google AI Overviews — with evidence, not guesses.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="/audit" onsubmit="document.getElementById('loading').style.display='block'; this.querySelector('button').disabled=true; this.querySelector('button').textContent='Running audit… (10-30s)';">
      <label for="url">Website URL *</label>
      <input id="url" name="url" type="text" placeholder="e.g. acmebakery.com" required value="{{ prev_url or '' }}">

      <label for="business_name">Business name <span style="font-weight:400;color:#565d6b;">(optional — guessed from the site if left blank)</span></label>
      <input id="business_name" name="business_name" type="text" placeholder="Acme Bakery" value="{{ prev_name or '' }}">

      <label for="location">Location <span style="font-weight:400;color:#565d6b;">(optional, for the report header only)</span></label>
      <input id="location" name="location" type="text" placeholder="Austin, TX" value="{{ prev_location or '' }}">

      <button type="submit">Run audit</button>
      <div class="hint" id="loading" style="display:none;">Fetching pages and running checks — this takes a few seconds per site.</div>
    </form>
  </div>
</body>
</html>
